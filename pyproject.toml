[build-system]
requires = ["setuptools >= 77", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "seecr-testtools"
authors = [
    {name = "Thijs Janssen", email = "thijs@seecr.nl"},
    {name = "Johan Jonkers", email = "johan@seecr.nl"},
]
description = "Small pytest helpers: wildcards in assertions, a recording mock and a login helper for web app tests"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["test", "testing", "pytest", "mock", "assertions", "wildcard"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pytest",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest >= 9.0.3, < 10",
    "pytest-asyncio >= 1.3.0, < 2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/seecr/seecr-testtools"
Source = "https://github.com/seecr/seecr-testtools"
Issues = "https://github.com/seecr/seecr-testtools/issues"

[tool.setuptools_scm]
version_file = "seecr_testtools/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["seecr_testtools*"]

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore:ast.NameConstant:DeprecationWarning",
    "ignore::DeprecationWarning:importlib._bootstrap",
]
