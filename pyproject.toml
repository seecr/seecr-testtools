[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "seecr-testtools"
authors = [
    {name = "Thijs Janssen", email = "thijs@seecr.nl"},
]
description = "Test tools for seecr"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["test", "pytest"]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pytest >= 9.0.2, < 10",
    "pytest-asyncio >= 1.3.0, < 2",
    "setuptools-scm >= 9.2.2, < 10",
]
dynamic = ["version"]

[tool.setuptools_scm]
version_file = "seecr_testtools/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore:ast.NameConstant:DeprecationWarning",
    "ignore::DeprecationWarning:importlib._bootstrap",
]
